# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/configuration/

# --- General Configuration ---
VALIDATE_ALL_CODEBASE: true
PRINT_ALPACA: false
SHOW_ELAPSED_TIME: true

# --- Excluded Paths ---
EXCLUDED_DIRECTORIES:
  - .git
  - .trunk
  - cache
  - output
  - backup

# --- Linters Configuration ---
# Explicitly disable DevSkim as requested
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM

# Linters enabled tailored to SmartDNS repository:
# Shell (Bash), Python, JavaScript, CSS, HTML, Markdown, YAML
ENABLE_LINTERS:
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - PYTHON_BLACK
  - PYTHON_FLAKE8
  - JAVASCRIPT_PRETTIER
  - CSS_PRETTIER
  - HTML_PRETTIER
  - MARKDOWN_MARKDOWNLINT
  - YAML_YAMLLINT
  - REPOSITORY_TRUFFLEHOG

# --- ShellCheck Specific ---
BASH_SHELLCHECK_ARGUMENTS: --severity=style
